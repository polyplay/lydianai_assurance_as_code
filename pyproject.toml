[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lydianai-assurance-as-code"
version = "0.1.0"
description = "Assurance-as-Code backend for safety and process evidence management"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "arq>=0.26",
    "asyncpg>=0.29",
    "bcrypt>=4.1",
    "cryptography>=42",
    "email-validator>=2.1",
    "fastapi>=0.111",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "PyJWT>=2.8",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
aac = "aac_backend.cli:main"

[tool.setuptools.packages.find]
include = ["aac_backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
